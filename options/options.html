<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <h1>Orbit 설정</h1>

      <div class="setting-item">
        <label>API Provider (AI 모델 제공자):</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="apiProvider" value="gemini" checked />
            Google Gemini API
          </label>
          <label class="radio-label">
            <input type="radio" name="apiProvider" value="openai" /> OpenAI
            Compatible (Local LLM, etc.)
          </label>
        </div>
      </div>

      <div class="setting-item" id="endpointGroup" style="display: none">
        <label for="apiEndpoint">Base URL (기본 주소):</label>
        <input
          type="text"
          id="apiEndpoint"
          placeholder="https://generativelanguage.googleapis.com"
        />
        <p class="description">
          API 서버의 기본 주소만 입력하세요.<br />
          OpenAI: <code>https://api.openai.com</code><br />
          Gemini: <code>https://generativelanguage.googleapis.com</code><br />
          Local: <code>http://localhost:8800</code>
        </p>
      </div>

      <div class="setting-item">
        <label for="geminiApiKey">API Key (API 키):</label>
        <input type="password" id="geminiApiKey" placeholder="YOUR_API_KEY" />
        <p class="description">
          API Key는 로컬에만 저장되며, 번역 기능에 사용됩니다.
        </p>
      </div>

      <div class="setting-item">
        <label for="modelName">Model Name (모델명):</label>
        <input
          type="text"
          id="modelName"
          placeholder="e.g., gemini-2.5-flash"
        />
        <p class="description">
          사용할 모델 이름을 지정하세요. (기본값: gemini-2.5-flash)
        </p>
      </div>

      <div class="setting-item">
        <label for="targetLanguage">번역 대상 언어:</label>
        <select id="targetLanguage">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">简体中文</option>
        </select>
        <p class="description">번역 결과를 표시할 언어를 선택하세요.</p>
      </div>

      <button id="saveButton">설정 저장</button>
      <div id="status" class="status-message"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
